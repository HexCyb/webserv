# webserv configuration — run with: ./webserv conf/default.conf

server {
    listen      127.0.0.1:8080;
    server_name localhost;
    root        ./www;
    index       index.html;
    client_max_body_size 1M;

    error_page 404 /errors/404.html;

    location / {
        methods GET;
    }

    # static files with a generated directory listing
    location /files {
        methods   GET DELETE;
        autoindex on;
    }

    # uploads: browser forms (multipart) or raw bodies (curl --data-binary)
    location /uploads {
        methods      GET POST DELETE;
        autoindex    on;
        upload_store ./www/uploads;
        client_max_body_size 50M;
    }

    # CGI: each extension runs with its own interpreter
    location /cgi-bin {
        methods GET POST;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/sh;
    }

    # an old address that now points home
    location /old {
        return 301 /;
    }
}

# virtual host: same address and port, picked by the Host header
server {
    listen      127.0.0.1:8080;
    server_name blog.local;
    root        ./www/blog;
}

# a second port
server {
    listen      127.0.0.1:8081;
    root        ./www/blog;
}
